controller_manager:
  ros__parameters:
    update_rate: 100
    use_sim_time: true

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController

diff_drive_controller:
  ros__parameters:
    left_wheel_names: ["left_wheel_joint"]
    right_wheel_names: ["right_wheel_joint"]

    wheel_separation: 0.34
    wheel_radius: 0.05

    odom_frame_id: odom
    base_frame_id: base_footprint
    enable_odom_tf: true
    open_loop: false
    position_feedback: true
    publish_rate: 50.0
    cmd_vel_timeout: 0.5

    use_stamped_vel: false

    publish_limited_velocity: true

    linear.x.has_velocity_limits: true
    linear.x.max_velocity: 0.20
    linear.x.min_velocity: -0.20
    linear.x.has_acceleration_limits: true
    linear.x.max_acceleration: 0.20
    linear.x.min_acceleration: -0.20

    angular.z.has_velocity_limits: true
    angular.z.max_velocity: 0.50
    angular.z.min_velocity: -0.50
    angular.z.has_acceleration_limits: true
    angular.z.max_acceleration: 0.50
    angular.z.min_acceleration: -0.50
